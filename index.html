// Real-time shared storage via Firebase Firestore, with offline caching enabled
// (see firebase config script) — works online and offline, syncing automatically
// once the connection returns.
const firestoreDoc = firebase.firestore().collection('clinic').doc('main');

function subscribeDb(onChange) {
  return firestoreDoc.onSnapshot(
    { includeMetadataChanges: true },
    async (snap) => {
      if (snap.exists) {
        onChange({ ...DEFAULT_DB, ...snap.data() });
      } else if (!snap.metadata.fromCache) {
        await firestoreDoc.set(DEFAULT_DB);
        onChange(DEFAULT_DB);
      }
    },
    (err) => console.error('Firestore sync error', err)
  );
}
async function saveDb(db) {
  try { await firestoreDoc.set(db); }
  catch (e) { console.error('save failed', e); }
}
function withItem(baseDb, coll, obj) {
  const item = { ...obj, id: uid(), createdAt: Date.now() };
  return { db: { ...baseDb, [coll]: [...baseDb[coll], item] }, item };
}

// WhatsApp helper — builds a wa.me link with a prefilled message (staff can edit before sending)
function waLink(phone, text) {
  let digits = String(phone || '').replace(/\D/g, '');
  if (!digits) return null;
  if (digits.startsWith('0')) digits = '20' + digits.slice(1);
  else if (!digits.startsWith('20')) digits = '20' + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(text || '')}`;
}

  { bg: 'bg-[#E4EEED]', text: 'text-[#2F5D5A]' },

// Searchable patient picker — type to filter instead of scrolling a long list
function PatientPicker({ patients, value, onChange, placeholder }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const selected = patients.find(p => p.id === value);
  useEffect(() => { setQuery(selected ? selected.name : ''); }, [value]);
  const q = query.trim();
  const results = (q ? patients.filter(p => p.name.includes(q) || (p.phone || '').includes(q)) : patients).slice(0, 8);
  return (
    <div className="relative">
      <TextInput
        value={query}
        onChange={e => { setQuery(e.target.value); setOpen(true); if (!e.target.value) onChange(''); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
        placeholder={placeholder || 'ابحث بالاسم أو الهاتف'}
      />
      {open && (
        <div className="absolute z-20 mt-1 w-full bg-white border border-[#DDD5C4] rounded-lg shadow-lg max-h-56 overflow-auto">
          {results.length ? results.map(p => (
            <button type="button" key={p.id}
              onMouseDown={() => { onChange(p.id); setQuery(p.name); setOpen(false); }}
              className="w-full text-right px-3 py-2 text-sm hover:bg-[#F6F3EC] border-b border-[#F1ECE0] last:border-0">
              <span className="font-semibold">{p.name}</span> <span className="text-xs text-[#8B8375]">{p.phone}</span>
            </button>
          )) : <p className="px-3 py-2 text-xs text-[#B7AF9F]">لا نتائج</p>}
        </div>
      )}
    </div>
  );
}

                  <button onClick={() => removeItem('patients', p.id)} className="text-[#B5502E]/70 hover:text-[#B5502E] p-1.5"><Trash2 size={16} /></button>

                  <Field label="الاسم"><TextInput value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} /></Field>
                  <Field label="الهاتف"><TextInput value={editForm.phone} onChange={e => setEditForm({ ...editForm, phone: e.target.value })} /></Field>
                  <Field label="السن"><TextInput type="number" value={editForm.age} onChange={e => setEditForm({ ...editForm, age: e.target.value })} /></Field>
                  <Field label="العنوان" className="md:col-span-2"><TextInput value={editForm.address} onChange={e => setEditForm({ ...editForm, address: e.target.value })} /></Field>
                  <Field label="ملاحظات طبية" className="md:col-span-3"><TextArea rows={2} value={editForm.notes} onChange={e => setEditForm({ ...editForm, notes: e.target.value })} /></Field>
                  <div className="md:col-span-3 flex justify-end gap-2">

                    <Btn onClick={saveEdit}><Check size={16} /> حفظ التعديل</Btn>
                  </div>
                </div>
              )}
              {open && (
                <div className="border-t border-[#EAE3D3] p-4 bg-[#FBF9F4] text-sm space-y-3">
                  {p.address && <p><span className="text-[#8B8375]">العنوان: </span>{p.address}</p>}
                  {p.notes && <p><span className="text-[#8B8375]">ملاحظات طبية: </span>{p.notes}</p>}
                  <div>
                    <p className="font-semibold text-[#5b5347] mb-1">سجل المواعيد ({appts.length})</p>
                    {appts.length ? appts.slice(0, 5).map(a => <p key={a.id} className="text-xs text-[#8B8375]">{a.date} — {a.time} — {a.status}</p>) : <p className="text-xs text-[#B7AF9F]">لا يوجد</p>}
                  </div>

                    <p className="font-semibold text-[#5b5347] mb-1">الروشتات ({rx.length}) · الفواتير ({invs.length})</p>

                  </div>
                </div>
              )}
            </div>
          );
        }) : <Empty text="لا يوجد مرضى مطابقون" />}
      </div>
    </div>
  );
}

// ---------- Invoices ----------
function InvoicesTab({ db, addItem, updateItem, removeItem, openPrint }) {
  const [patientId, setPatientId] = useState('');
  const [doctorId, setDoctorId] = useState('');
  const [date, setDate] = useState(todayStr());
  const [status, setStatus] = useState('مدفوع');
  const [method, setMethod] = useState('كاش');
  const [discount, setDiscount] = useState('0');
  const [items, setItems] = useState([{ desc: '', qty: '1', price: '' }]);

  const updateRow = (i, patch) => setItems(items.map((it, idx) => idx === i ? { ...it, ...patch } : it));
  const addRow = () => setItems([...items, { desc: '', qty: '1', price: '' }]);
  const delRow = (i) => setItems(items.filter((_, idx) => idx !== i));
  const subtotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  const total = Math.max(0, subtotal - (Number(discount) || 0));

  const submit = (e) => {
    e.preventDefault();
    if (!patientId) return;
    const clean = items.filter(it => it.desc.trim());
    if (!clean.length) return;
    const invoiceNumber = 'INV-' + String(db.invoices.length + 1).padStart(4, '0');
    addItem('invoices', {
      invoiceNumber, patientId, doctorId, date, status, method, discount: Number(discount) || 0,
      items: clean.map(it => ({ desc: it.desc, qty: Number(it.qty) || 0, price: Number(it.price) || 0 })),
      subtotal, total,
    });
    setDiscount('0'); setItems([{ desc: '', qty: '1', price: '' }]);
  };

  const list = [...db.invoices].sort((a, b) => b.createdAt - a.createdAt);
  const patientName = (id) => db.patients.find(p => p.id === id)?.name || '—';

  return (
    <div>
      <SectionHeader icon={Receipt} title="الفواتير" subtitle="إنشاء وطباعة فاتورة إلكترونية" />

      {!db.patients.length && <Empty text="أضف مريضًا أولاً" />}

      {!!db.patients.length && (
        <form onSubmit={submit} className="bg-white border border-[#EAE3D3] rounded-xl p-4 mb-6">
          <div className="grid md:grid-cols-4 gap-3 mb-3">
            <Field label="المريض *"><PatientPicker patients={db.patients} value={patientId} onChange={setPatientId} /></Field>
            <Field label="الطبيب"><Select value={doctorId} onChange={e => setDoctorId(e.target.value)}><option value="">—</option>{db.doctors.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</Select></Field>
            <Field label="التاريخ"><TextInput type="date" value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="طريقة الدفع"><Select value={method} onChange={e => setMethod(e.target.value)}><option>كاش</option><option>فيزا</option><option>انستاباي</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option></Select></Field>
          </div>

          <p className="text-sm font-semibold text-[#5b5347] mb-2">البنود</p>
          <div className="flex flex-col gap-2 mb-2">
            {items.map((it, i) => (
              <div key={i} className="flex gap-2 items-center">
                <TextInput className="flex-1" placeholder="البيان (مثال: حشو ضرس)" value={it.desc} onChange={e => updateRow(i, { desc: e.target.value })} />
                <TextInput className="w-20" type="number" placeholder="الكمية" value={it.qty} onChange={e => updateRow(i, { qty: e.target.value })} />
                <TextInput className="w-28" type="number" placeholder="السعر" value={it.price} onChange={e => updateRow(i, { price: e.target.value })} />
                <button type="button" onClick={() => delRow(i)} className="text-[#B5502E]/70 hover:text-[#B5502E]"><X size={16} /></button>
              </div>
            ))}
          </div>
          <button type="button" onClick={addRow} className="text-xs font-semibold text-[#2F5D5A] mb-3">+ إضافة بند</button>

          <div className="flex items-center justify-end gap-4 flex-wrap border-t border-[#EAE3D3] pt-3">
            <Field label="الخصم (ج.م)"><TextInput type="number" className="w-28" value={discount} onChange={e => setDiscount(e.target.value)} /></Field>
            <Field label="حالة الدفع"><Select value={status} onChange={e => setStatus(e.target.value)}><option>مدفوع</option><option>غير مدفوع</option><option>جزئي</option></Select></Field>
            <div className="text-left">
              <p className="text-xs text-[#8B8375]">الإجمالي</p>
              <p className="text-xl font-extrabold text-[#2F5D5A]">{money(total)} ج.م</p>
            </div>
            <Btn type="submit"><Plus size={16} /> حفظ الفاتورة</Btn>
          </div>
        </form>
      )}

      <div className="flex flex-col gap-2">
        {list.length ? list.map(inv => (
          <div key={inv.id} className="bg-white border border-[#EAE3D3] rounded-xl p-3.5 flex items-center justify-between flex-wrap gap-2">
            <div>
              <p className="font-bold text-[#1E2B33]">{patientName(inv.patientId)} <span className="text-xs text-[#8B8375] font-normal">· {inv.invoiceNumber}</span></p>
              <p className="text-xs text-[#8B8375]">{inv.date} · {money(inv.total)} ج.م</p>
            </div>
            <div className="flex items-center gap-2">
              <Select value={inv.status} onChange={e => updateItem('invoices', inv.id, { status: e.target.value })} className="!py-1 !px-2 text-xs">
                <option>مدفوع</option><option>غير مدفوع</option><option>جزئي</option>
              </Select>
              <Btn variant="ghost" onClick={() => openPrint({ type: 'invoice', id: inv.id })}><Printer size={15} /> طباعة</Btn>
              <button onClick={() => removeItem('invoices', inv.id)} className="text-[#B5502E]/70 hover:text-[#B5502E] p-2"><Trash2 size={16} /></button>
            </div>
          </div>
        )) : <Empty text="لا توجد فواتير بعد" />}
      </div>
    </div>
  );
}

// ---------- Inventory ----------
function InventoryTab({ db, addItem, updateItem, removeItem }) {
  const [form, setForm] = useState({ name: '', category: '', qty: '', unit: 'قطعة', minQty: '5', price: '' });
  const [catalogCat, setCatalogCat] = useState(DENTAL_CATALOG[0].cat);
  const [catalogPick, setCatalogPick] = useState('');
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState(null);

  const startEdit = (i) => { setEditId(i.id); setEditForm({ name: i.name, category: i.category || '', unit: i.unit, minQty: i.minQty, price: i.price }); };
  const saveEdit = () => {
    if (editForm && editForm.name.trim()) {
      updateItem('inventory', editId, { ...editForm, minQty: Number(editForm.minQty) || 0, price: Number(editForm.price) || 0 });
    }
    setEditId(null); setEditForm(null);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!form.name.trim()) return;
    addItem('inventory', { ...form, qty: Number(form.qty) || 0, minQty: Number(form.minQty) || 0, price: Number(form.price) || 0 });
    setForm({ name: '', category: '', qty: '', unit: 'قطعة', minQty: '5', price: '' });
  };

  const quickAdd = () => {
    if (!catalogPick) return;
    if (db.inventory.some(i => i.name === catalogPick)) return;
    addItem('inventory', { name: catalogPick, category: catalogCat, qty: 0, unit: 'قطعة', minQty: 5, price: 0 });
    setCatalogPick('');
  };

  const totalValue = db.inventory.reduce((s, i) => s + i.qty * i.price, 0);
  const lowCount = db.inventory.filter(i => i.qty <= i.minQty).length;

  return (
    <div>
      <SectionHeader icon={Package} title="المخزون والمستهلكات" subtitle={`قيمة المخزون: ${money(totalValue)} ج.م · ${lowCount} صنف منخفض`} />

      <div className="bg-[#EFE9DA] border border-[#DDD5C4] rounded-xl p-4 mb-4">
        <p className="text-sm font-semibold text-[#5b5347] mb-2">إضافة سريعة من قائمة الأدوية والمستهلكات الشائعة في السوق المصري</p>
        <div className="flex flex-wrap gap-2 items-end">
          <Field label="الفئة">
            <Select value={catalogCat} onChange={e => { setCatalogCat(e.target.value); setCatalogPick(''); }}>
              {DENTAL_CATALOG.map(c => <option key={c.cat} value={c.cat}>{c.cat}</option>)}
            </Select>
          </Field>
          <Field label="الصنف">
            <Select value={catalogPick} onChange={e => setCatalogPick(e.target.value)} className="min-w-[220px]">
              <option value="">اختر صنفًا</option>
              {DENTAL_CATALOG.find(c => c.cat === catalogCat)?.items.map(n => <option key={n} value={n}>{n}</option>)}
            </Select>
          </Field>
          <Btn variant="accent" onClick={quickAdd}><Plus size={16} /> إضافة للمخزون</Btn>
        </div>
      </div>

      <form onSubmit={submit} className="bg-white border border-[#EAE3D3] rounded-xl p-4 mb-6 grid md:grid-cols-3 gap-3">
        <Field label="اسم الصنف *"><TextInput value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required /></Field>
        <Field label="الفئة"><TextInput value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} placeholder="مواد حشو، مخدر موضعي..." /></Field>

// ---------- Accounts & Salaries ----------
function AccountsTab({ db, addItem, removeItem, markSalaryPaid }) {
  const [month, setMonth] = useState(monthStr());
  const [exp, setExp] = useState({ date: todayStr(), description: '', category: '', amount: '' });

  const submitExpense = (e) => {
    e.preventDefault();
    if (!exp.description.trim() || !exp.amount) return;
    addItem('expenses', { ...exp, amount: Number(exp.amount) || 0 });
    setExp({ date: todayStr(), description: '', category: '', amount: '' });
  };

  const monthInvoices = db.invoices.filter(i => i.date.slice(0, 7) === month && i.status === 'مدفوع');
  const revenue = monthInvoices.reduce((s, i) => s + i.total, 0);
  const monthExpenses = db.expenses.filter(x => x.date.slice(0, 7) === month);
  const totalExpenses = monthExpenses.reduce((s, x) => s + x.amount, 0);

  const doctorSalaries = db.doctors.map(d => {
    const rev = monthInvoices.filter(i => i.doctorId === d.id).reduce((s, i) => s + i.total, 0);
    const salary = d.salaryType === 'percentage' ? rev * (d.salaryValue / 100) : d.salaryValue;
    const paid = db.salaryPayments.some(p => p.personId === d.id && p.month === month);
    return { id: d.id, name: d.name, rev, salary, paid, type: 'doctor' };
  });
  const staffSalaries = db.staff.map(s => {
    const paid = db.salaryPayments.some(p => p.personId === s.id && p.month === month);
    return { id: s.id, name: s.name, rev: null, salary: s.monthlySalary, paid, type: 'staff' };
  });
  const totalSalaries = [...doctorSalaries, ...staffSalaries].reduce((s, x) => s + x.salary, 0);
  const net = revenue - totalExpenses - totalSalaries;

  const SalaryRow = ({ p }) => (
    <div className="flex items-center justify-between bg-white border border-[#EAE3D3] rounded-lg p-3">
      <div>
        <p className="font-bold text-[#1E2B33] text-sm">{p.name}</p>
        {p.rev !== null && <p className="text-xs text-[#8B8375]">إيراد الشهر: {money(p.rev)} ج.م</p>}
      </div>
      <div className="flex items-center gap-3">
        <p className="font-bold text-[#2F5D5A]">{money(p.salary)} ج.م</p>
        {p.paid ? <Badge tone="good"><Check size={12} className="inline" /> مدفوع</Badge> :
          <Btn variant="muted" onClick={() => markSalaryPaid(p.id, p.type, month, p.salary)}>تسجيل الدفع</Btn>}
      </div>
    </div>
  );

  return (
    <div>
      <SectionHeader icon={Wallet} title="الحسابات والمرتبات"
        action={<TextInput type="month" value={month} onChange={e => setMonth(e.target.value)} />} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        {[
          { label: 'الإيراد', value: revenue, tone: 'text-[#4C6E52]' },
          { label: 'المصروفات', value: totalExpenses, tone: 'text-[#A34222]' },
          { label: 'المرتبات', value: totalSalaries, tone: 'text-[#8A6A1F]' },
          { label: 'صافي الربح', value: net, tone: net >= 0 ? 'text-[#2F5D5A]' : 'text-[#A34222]' },
        ].map((s, i) => (
          <div key={i} className="bg-white border border-[#EAE3D3] rounded-xl p-4">
            <p className="text-xs text-[#8B8375] mb-1">{s.label}</p>
            <p className={`text-lg font-extrabold ${s.tone}`}>{money(s.value)} ج.م</p>
          </div>
        ))}
      </div>

      <h3 className="font-bold text-[#1E2B33] mb-2" style={{ fontFamily: "'Zain', sans-serif" }}>مرتبات الأطباء</h3>
      <div className="flex flex-col gap-2 mb-6">
        {doctorSalaries.length ? doctorSalaries.map(p => <SalaryRow key={p.id} p={p} />) : <Empty text="لا يوجد أطباء" />}
      </div>

      <h3 className="font-bold text-[#1E2B33] mb-2" style={{ fontFamily: "'Zain', sans-serif" }}>مرتبات الفريق الإداري</h3>
      <div className="flex flex-col gap-2 mb-8">
        {staffSalaries.length ? staffSalaries.map(p => <SalaryRow key={p.id} p={p} />) : <Empty text="لا يوجد موظفون" />}
      </div>

      <h3 className="font-bold text-[#1E2B33] mb-2" style={{ fontFamily: "'Zain', sans-serif" }}>المصروفات</h3>
      <form onSubmit={submitExpense} className="bg-white border border-[#EAE3D3] rounded-xl p-4 mb-4 grid md:grid-cols-4 gap-3">
        <Field label="التاريخ"><TextInput type="date" value={exp.date} onChange={e => setExp({ ...exp, date: e.target.value })} /></Field>
        <Field label="البيان *"><TextInput value={exp.description} onChange={e => setExp({ ...exp, description: e.target.value })} required /></Field>
        <Field label="الفئة"><TextInput value={exp.category} onChange={e => setExp({ ...exp, category: e.target.value })} placeholder="إيجار، فواتير، مشتريات..." /></Field>
        <Field label="المبلغ (ج.م) *"><TextInput type="number" value={exp.amount} onChange={e => setExp({ ...exp, amount: e.target.value })} required /></Field>
        <div className="md:col-span-4 flex justify-end"><Btn type="submit"><Plus size={16} /> إضافة مصروف</Btn></div>
      </form>
      <div className="flex flex-col gap-2">
        {monthExpenses.length ? monthExpenses.map(x => (
          <div key={x.id} className="flex items-center justify-between bg-white border border-[#EAE3D3] rounded-lg p-3">
            <div><p className="font-semibold text-[#1E2B33] text-sm">{x.description}</p><p className="text-xs text-[#8B8375]">{x.date} · {x.category}</p></div>
            <div className="flex items-center gap-3"><p className="font-bold text-[#B5502E]">{money(x.amount)} ج.م</p><button onClick={() => removeItem('expenses', x.id)} className="text-[#B5502E]/70 hover:text-[#B5502E]"><Trash2 size={16} /></button></div>
          </div>
        )) : <Empty text="لا توجد مصروفات هذا الشهر" />}
      </div>
    </div>
  );
}

const ROLE_LABELS = { partner: 'شريك', doctor: 'طبيب', nursing: 'تمريض', reception: 'استقبال' };
const PERMISSIONS = {
  partner: ['dashboard', 'appointments', 'patients', 'doctors', 'prescriptions', 'invoices', 'inventory', 'accounts', 'settings', 'users'],
  doctor: ['dashboard', 'appointments', 'patients', 'prescriptions', 'invoices', 'inventory'],
  nursing: ['dashboard', 'appointments', 'patients', 'inventory'],
  reception: ['dashboard', 'appointments', 'patients', 'invoices'],
};
const AUTH_ERROR_AR = {
  'auth/wrong-password': 'كلمة المرور غير صحيحة',
  'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
  'auth/email-already-in-use': 'هذا البريد مستخدم بالفعل',
  'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل)',
  'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
  'auth/invalid-credential': 'بيانات الدخول غير صحيحة',
};
const authErr = (e) => AUTH_ERROR_AR[e?.code] || 'حدث خطأ، حاول مرة أخرى';

function AuthScreen() {
  const [mode, setMode] = useState('login');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState('reception');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr(''); setBusy(true);
    try {
      if (mode === 'login') {
        await firebase.auth().signInWithEmailAndPassword(email, password);
      } else {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        await firebase.firestore().collection('users').doc(cred.user.uid).set({
          name: name.trim() || email, email, role, createdAt: Date.now(),
        });
      }
    } catch (e2) {
      setErr(authErr(e2));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div dir="rtl" className="min-h-screen bg-[#F6F3EC] flex items-center justify-center p-4" style={{ fontFamily: "'Cairo', sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&family=Cairo:wght@400;500;600;700;800&display=swap');`}</style>
      <div className="w-full max-w-sm bg-white border border-[#EAE3D3] rounded-2xl p-6">
        <div className="flex flex-col items-center mb-5">
          <img src={LOGO_DATA_URI} alt="" className="h-16 w-auto mb-2" />
          <h1 className="text-xl font-extrabold text-[#2F5D5A]" style={{ fontFamily: "'Zain', sans-serif" }}>Royal Dental House</h1>
        </div>
        <div className="flex gap-2 mb-4">
          <button type="button" onClick={() => setMode('login')} className={`flex-1 text-sm font-semibold py-2 rounded-lg ${mode === 'login' ? 'bg-[#2F5D5A] text-white' : 'bg-[#EDE8DC] text-[#5b5347]'}`}>تسجيل دخول</button>
          <button type="button" onClick={() => setMode('signup')} className={`flex-1 text-sm font-semibold py-2 rounded-lg ${mode === 'signup' ? 'bg-[#2F5D5A] text-white' : 'bg-[#EDE8DC] text-[#5b5347]'}`}>حساب جديد</button>
        </div>
        <form onSubmit={submit} className="flex flex-col gap-3">
          {mode === 'signup' && (
            <Field label="الاسم"><TextInput value={name} onChange={e => setName(e.target.value)} required /></Field>
          )}
          <Field label="البريد الإلكتروني"><TextInput type="email" value={email} onChange={e => setEmail(e.target.value)} required /></Field>
          <Field label="كلمة المرور"><TextInput type="password" value={password} onChange={e => setPassword(e.target.value)} required minLength={6} /></Field>
          {mode === 'signup' && (
            <Field label="الصفة الوظيفية">
              <Select value={role} onChange={e => setRole(e.target.value)}>
                <option value="reception">استقبال</option>
                <option value="nursing">تمريض</option>
                <option value="doctor">طبيب</option>
                <option value="partner">شريك</option>
              </Select>
            </Field>
          )}
          {err && <p className="text-xs text-[#B5502E] bg-[#F5E4DE] rounded-lg px-3 py-2">{err}</p>}
          <Btn type="submit" disabled={busy} className="justify-center mt-1">{busy ? '...' : mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</Btn>
        </form>
      </div>
    </div>
  );
}

  { id: 'inventory', label: 'المخزون', icon: Package },
  { id: 'accounts', label: 'الحسابات والمرتبات', icon: Wallet },
  { id: 'settings', label: 'الإعدادات', icon: SettingsIcon },
  { id: 'users', label: 'المستخدمون', icon: Users },
];

function App() {
  const [db, setDb] = useState(null);
  const [tab, setTab] = useState('dashboard');
  const [printDoc, setPrintDoc] = useState(null);
  const [authUser, setAuthUser] = useState(undefined); // undefined=loading, null=logged out, object=logged in
  const [users, setUsers] = useState([]);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(async (fbUser) => {
      if (!fbUser) { setAuthUser(null); return; }
      try {
        const roleSnap = await firebase.firestore().collection('users').doc(fbUser.uid).get();
        setAuthUser({
          uid: fbUser.uid,
          email: fbUser.email,
          name: roleSnap.exists ? (roleSnap.data().name || fbUser.email) : fbUser.email,
          role: roleSnap.exists ? roleSnap.data().role : null,
        });
      } catch (e) {
        setAuthUser({ uid: fbUser.uid, email: fbUser.email, name: fbUser.email, role: null });
      }
    });
    return () => unsub();
  }, []);

  useEffect(() => { const unsub = subscribeDb(setDb); return () => unsub(); }, []);

  useEffect(() => {
    if (!authUser || authUser.role !== 'partner') return;
    const unsub = firebase.firestore().collection('users').onSnapshot(snap => {
      setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return () => unsub();
  }, [authUser?.role]);

  if (authUser === undefined) {
    return <div className="min-h-screen flex items-center justify-center bg-[#F6F3EC] text-[#8B8375]">جارِ التحميل...</div>;
  }
  if (authUser === null) {
    return <AuthScreen />;
  }
  if (!db) {
    return <div className="min-h-screen flex items-center justify-center bg-[#F6F3EC] text-[#8B8375]">جارِ التحميل...</div>;
  }
  if (!authUser.role) {
    return (
      <div dir="rtl" className="min-h-screen bg-[#F6F3EC] flex items-center justify-center p-4 text-center" style={{ fontFamily: "'Cairo', sans-serif" }}>
        <div>
          <p className="text-[#5b5347] mb-3">في انتظار تفعيل صلاحياتك من أحد الشركاء.</p>
          <Btn variant="muted" onClick={() => firebase.auth().signOut()}>تسجيل خروج</Btn>
        </div>
      </div>
    );
  }
  const allowedTabs = TABS.filter(t => (PERMISSIONS[authUser.role] || []).includes(t.id));
  const activeTab = allowedTabs.some(t => t.id === tab) ? tab : (allowedTabs[0]?.id || 'dashboard');

  const persist = (next) => { setDb(next); saveDb(next); };
  const addItem = (coll, obj) => { const { db: next, item } = withItem(db, coll, obj); persist(next); return item; };
  const updateItem = (coll, id, patch) => { persist({ ...db, [coll]: db[coll].map(x => x.id === id ? { ...x, ...patch } : x) }); };
  const removeItem = (coll, id) => { persist({ ...db, [coll]: db[coll].filter(x => x.id !== id) }); };
  const updateSettings = (patch) => { persist({ ...db, settings: { ...db.settings, ...patch } }); };
  const addPatientAndAppointment = (patientObj, apptObj) => {
    const { db: db1, item: patient } = withItem(db, 'patients', patientObj);
    const { db: db2 } = withItem(db1, 'appointments', { ...apptObj, patientId: patient.id });
    persist(db2);
  };
  const markSalaryPaid = (personId, personType, month, amount) => {
    addItem('salaryPayments', { personId, personType, month, amount, paidAt: Date.now() });
  };

  const openPrint = ({ type, id }) => {
    const data = type === 'prescription' ? db.prescriptions.find(x => x.id === id) : db.invoices.find(x => x.id === id);
    if (data) setPrintDoc({ type, data });
  };

  const renderTab = () => {
    switch (activeTab) {
      case 'dashboard': return <DashboardTab db={db} setTab={setTab} />;
      case 'appointments': return <AppointmentsTab db={db} addItem={addItem} updateItem={updateItem} removeItem={removeItem} addPatientAndAppointment={addPatientAndAppointment} />;
      case 'patients': return <PatientsTab db={db} addItem={addItem} updateItem={updateItem} removeItem={removeItem} />;
      case 'doctors': return <DoctorsTab db={db} addItem={addItem} updateItem={updateItem} removeItem={removeItem} />;
      case 'prescriptions': return <PrescriptionsTab db={db} addItem={addItem} removeItem={removeItem} openPrint={openPrint} />;
      case 'invoices': return <InvoicesTab db={db} addItem={addItem} updateItem={updateItem} removeItem={removeItem} openPrint={openPrint} />;
      case 'inventory': return <InventoryTab db={db} addItem={addItem} updateItem={updateItem} removeItem={removeItem} />;
      case 'accounts': return <AccountsTab db={db} addItem={addItem} removeItem={removeItem} markSalaryPaid={markSalaryPaid} />;
      case 'settings': return <SettingsTab db={db} updateSettings={updateSettings} />;
      case 'users': return <UsersTab users={users} currentUid={authUser.uid} />;
      default: return null;
    }
  };

  return (
    <div dir="rtl" className="min-h-screen bg-[#F6F3EC] print:hidden" style={{ fontFamily: "'Cairo', sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&family=Cairo:wght@400;500;600;700;800&display=swap');`}</style>

      <header className="bg-[#2F5D5A] text-white px-4 py-2.5 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <img src={LOGO_DATA_URI} alt="Royal Dental House" className="h-11 w-auto" />
          <h1 className="text-xl font-extrabold" style={{ fontFamily: "'Zain', sans-serif" }}>{db.settings.name}</h1>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-xs text-white/80 hidden sm:block">{authUser.name} · {ROLE_LABELS[authUser.role] || authUser.role}</span>
          <button onClick={() => firebase.auth().signOut()} className="text-xs font-semibold bg-white/10 hover:bg-white/20 rounded-lg px-2.5 py-1.5">تسجيل خروج</button>
        </div>
      </header>

      <nav className="bg-white border-b border-[#EAE3D3] px-2 overflow-x-auto">
        <div className="flex gap-1 min-w-max">
          {allowedTabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex items-center gap-1.5 px-3.5 py-3 text-sm font-semibold border-b-2 transition-colors whitespace-nowrap ${activeTab === t.id ? 'border-[#B5502E] text-[#B5502E]' : 'border-transparent text-[#8B8375] hover:text-[#5b5347]'}`}>
              <t.icon size={16} /> {t.label}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-6xl mx-auto p-4 sm:p-6">
        {renderTab()}
      </main>

      <PrintPreview db={db} printDoc={printDoc} onClose={() => setPrintDoc(null)} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
